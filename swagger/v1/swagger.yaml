---
openapi: 3.0.1
info:
  title: Kondangyuk API
  version: v1
  description: API documentation for Kondangyuk
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
  schemas:
    JSendSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
    JSendFail:
      type: object
      properties:
        status:
          type: string
          example: fail
        data:
          type: object
tags:
- name: Public | Sessions
  description: Authentication — login and logout. No authentication required.
- name: Admin | Profiles
  description: Authenticated user profile. Accessible by **admin** and **super_admin**
    roles.
- name: Super Admin | Users
  description: Admin user management. Accessible by **super_admin** role only.
- name: Super Admin | Themes
  description: Digital invitation theme management. Accessible by **super_admin**
    role only.
servers:
- url: http://localhost:3000
  description: Development
paths:
  "/api/v1/guest/invitations/{slug}":
    get:
      summary: Show published invitation (public customer page)
      tags:
      - Public | Invitations
      description: Public customer page — returns a published, non-expired invitation
        by slug together with its document (meta + MDX) and thumbnail URL. No authentication
        required. Unpublished or expired invitations return 404.
      parameters:
      - name: slug
        in: path
        required: true
        description: Invitation slug
        schema:
          type: string
      responses:
        '200':
          description: invitation returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      invitation:
                        type: object
                        properties:
                          id:
                            type: integer
                          slug:
                            type: string
                          name:
                            type: string
                          description:
                            type: string
                            nullable: true
                          published_at:
                            type: string
                            format: date-time
                            nullable: true
                          expires_at:
                            type: string
                            format: date-time
                            nullable: true
                          thumbnail_url:
                            type: string
                            nullable: true
                          document:
                            type: object
                            properties:
                              meta:
                                type: object
                              document:
                                type: string
        '404':
          description: expired invitation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/guest/session":
    post:
      summary: Login
      tags:
      - Public | Sessions
      description: Authenticates user and sets httpOnly session cookie. Rate limited
        to 10 requests/minute per IP.
      parameters:
      - name: Accept-Language
        in: header
        required: false
        description: 'Response language — "id" or "en" (default: en when absent/unsupported)'
        schema:
          type: string
      responses:
        '201':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
        '422':
          description: account deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  data:
                    type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    email:
                      type: string
                      example: admin@kondangyuk.test
                    password:
                      type: string
                      example: Password12345!
                  required:
                  - email
                  - password
        required: true
    delete:
      summary: Logout
      tags:
      - Public | Sessions
      description: Destroys the current session and clears the session cookie.
      security:
      - cookieAuth: []
      responses:
        '204':
          description: logout successful
  "/api/v1/guest/templates":
    get:
      summary: List published templates (public catalog)
      tags:
      - Public | Templates
      description: Public template catalog — returns published templates (those with
        a published_at) with pagination, optionally filtered by theme or tier. No
        authentication required. Unpublished/draft templates are excluded.
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: 'Items per page — allowed: 10, 30, 50 (other/over → 10)'
        schema:
          type: integer
      - name: q[name_or_slug_cont]
        in: query
        required: false
        description: Search by name or slug (case-insensitive contains)
        schema:
          type: string
      - name: q[themes_id_eq]
        in: query
        required: false
        description: Filter by theme id (templates having that theme)
        schema:
          type: integer
      - name: q[tier_id_eq]
        in: query
        required: false
        description: Filter by tier id
        schema:
          type: integer
      responses:
        '200':
          description: templates returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            slug:
                              type: string
                            name:
                              type: string
                            description:
                              type: string
                              nullable: true
                            published_at:
                              type: string
                              format: date-time
                              nullable: true
                            thumbnail_url:
                              type: string
                              nullable: true
                            themes:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                            tier:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 1
                          total_count:
                            type: integer
                            example: 3
                          prev_page:
                            type: integer
                            nullable: true
                            example:
                          next_page:
                            type: integer
                            nullable: true
                            example:
                          limit:
                            type: integer
                            example: 10
  "/api/v1/guest/templates/{slug}":
    get:
      summary: Show published template (public detail with document)
      tags:
      - Public | Templates
      description: Public template detail — returns a published template by slug together
        with its document (meta + MDX) and thumbnail URL, so the client can render
        the content. No authentication required. Unpublished templates, or published
        templates without a document, return 404.
      parameters:
      - name: slug
        in: path
        required: true
        description: Template slug
        schema:
          type: string
      responses:
        '200':
          description: template returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      template:
                        type: object
                        properties:
                          id:
                            type: integer
                          slug:
                            type: string
                          name:
                            type: string
                          description:
                            type: string
                            nullable: true
                          published_at:
                            type: string
                            format: date-time
                            nullable: true
                          thumbnail_url:
                            type: string
                            nullable: true
                          themes:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                          tier:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                          document:
                            type: object
                            properties:
                              meta:
                                type: object
                              document:
                                type: string
        '404':
          description: published template without a document
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/autocomplete/marketplaces":
    get:
      summary: Marketplace autocomplete
      tags:
      - Super Admin | Autocomplete
      description: Lightweight marketplace lookup for select/autocomplete inputs.
        Returns id and name only, capped at 10 results, searchable by name via ransack.
        Super_admin only.
      security:
      - cookieAuth: []
      parameters:
      - name: q[name_cont]
        in: query
        required: false
        description: Filter marketplaces by name (case-insensitive contains)
        schema:
          type: string
      responses:
        '200':
          description: marketplaces filtered by name and capped at 10
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      marketplaces:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/autocomplete/templates":
    get:
      summary: Template autocomplete
      tags:
      - Super Admin | Autocomplete
      description: Lightweight template lookup for select/autocomplete inputs. Returns
        id, name and slug only, capped at 10 results, searchable by name via ransack.
        Only published (and non-deleted) templates are returned. Super_admin only.
      security:
      - cookieAuth: []
      parameters:
      - name: q[name_cont]
        in: query
        required: false
        description: Filter templates by name (case-insensitive contains)
        schema:
          type: string
      responses:
        '200':
          description: published templates filtered by name and capped at 10
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            slug:
                              type: string
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/autocomplete/themes":
    get:
      summary: Theme autocomplete
      tags:
      - Super Admin | Autocomplete
      description: Lightweight theme lookup for select/autocomplete inputs. Returns
        id and name only, capped at 10 results, searchable by name via ransack. Super_admin
        only.
      security:
      - cookieAuth: []
      parameters:
      - name: q[name_cont]
        in: query
        required: false
        description: Filter themes by name (case-insensitive contains)
        schema:
          type: string
      responses:
        '200':
          description: themes filtered by name and capped at 10
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      themes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/autocomplete/tiers":
    get:
      summary: Tier autocomplete
      tags:
      - Super Admin | Autocomplete
      description: Lightweight tier lookup for select/autocomplete inputs. Returns
        id and name only, capped at 10 results, searchable by name via ransack. Super_admin
        only.
      security:
      - cookieAuth: []
      parameters:
      - name: q[name_cont]
        in: query
        required: false
        description: Filter tiers by name (case-insensitive contains)
        schema:
          type: string
      responses:
        '200':
          description: tiers filtered by name and capped at 10
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      tiers:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/invitations/{invitation_id}/document/media":
    parameters:
    - name: invitation_id
      in: path
      required: true
      description: Invitation ID or slug
      schema:
        type: string
    get:
      summary: List document media
      tags:
      - Super Admin | Media
      description: Lists media attached to an invitation document (proxy URLs). Accessible
        by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: media returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '404':
          description: invitation or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
    post:
      summary: Upload document media
      tags:
      - Super Admin | Media
      description: Uploads a media file (image/audio/video) to an invitation document
        and returns its stable proxy URL. Accessible by super_admin only.
      security:
      - cookieAuth: []
      parameters: []
      responses:
        '201':
          description: media uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '422':
          description: unsupported media type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
  "/api/v1/super_admin/invitations/{invitation_id}/document/media/{id}":
    parameters:
    - name: invitation_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      description: Media (attachment) ID
      schema:
        type: integer
    delete:
      summary: Delete document media
      tags:
      - Super Admin | Media
      description: Permanently deletes (purges) a media attachment by ID — hard delete.
        Accessible by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: media deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '404':
          description: media not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/invitations/{invitation_id}/document":
    parameters:
    - name: invitation_id
      in: path
      required: true
      description: Invitation ID or slug
      schema:
        type: string
    get:
      summary: Show invitation document
      tags:
      - Super Admin | Invitation Documents
      description: Returns the invitation document (meta + MDX snapshot). Accessible
        by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: document returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '404':
          description: invitation or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
    patch:
      summary: Update invitation document
      tags:
      - Super Admin | Invitation Documents
      description: Updates the invitation document (meta + MDX). Accessible by super_admin
        only.
      security:
      - cookieAuth: []
      parameters: []
      responses:
        '200':
          description: document updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '404':
          description: invitation or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invitation_document:
                  type: object
                  properties:
                    meta:
                      type: object
                    document:
                      type: string
                  required:
                  - document
        required: true
    delete:
      summary: Delete invitation document
      tags:
      - Super Admin | Invitation Documents
      description: Permanently deletes an invitation document (hard delete). The invitation_documents
        table has no deleted_at column. Accessible by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: document deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '404':
          description: invitation or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/invitations/{invitation_id}/publication":
    parameters:
    - name: invitation_id
      in: path
      required: true
      description: Invitation ID
      schema:
        type: integer
    post:
      summary: Publish invitation
      tags:
      - Super Admin | Invitations
      description: Publishes an invitation by setting published_at to the current
        time, making it visible on its public page. Accessible by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: invitation published
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      invitation:
                        type: object
                        properties:
                          id:
                            type: integer
                          slug:
                            type: string
                          name:
                            type: string
                          published_at:
                            type: string
                            format: date-time
                          expires_at:
                            type: string
                            nullable: true
        '404':
          description: invitation not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
    delete:
      summary: Unpublish invitation
      tags:
      - Super Admin | Invitations
      description: Unpublishes an invitation by clearing published_at. Accessible
        by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: invitation unpublished
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      invitation:
                        type: object
                        properties:
                          id:
                            type: integer
                          slug:
                            type: string
                          name:
                            type: string
                          published_at:
                            type: string
                            nullable: true
                          expires_at:
                            type: string
                            nullable: true
        '404':
          description: invitation not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/invitations/{invitation_id}/thumbnail":
    parameters:
    - name: invitation_id
      in: path
      required: true
      description: Invitation ID or slug
      schema:
        type: string
    get:
      summary: Show thumbnail
      tags:
      - Super Admin | Thumbnails
      description: Returns the invitation thumbnail proxy URL (or null). Accessible
        by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: thumbnail returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '404':
          description: invitation not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
    put:
      summary: Upload thumbnail
      tags:
      - Super Admin | Thumbnails
      description: Uploads/replaces the invitation thumbnail (image only). Accessible
        by super_admin only.
      security:
      - cookieAuth: []
      parameters: []
      responses:
        '200':
          description: thumbnail uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '422':
          description: not an image
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
    delete:
      summary: Remove thumbnail
      tags:
      - Super Admin | Thumbnails
      description: Removes (purges) the invitation thumbnail — hard delete. Accessible
        by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: thumbnail removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/super_admin/invitations/{id}":
    get:
      summary: Show invitation
      tags:
      - Super Admin | Invitations
      description: Returns a single invitation by ID or slug. Invitations are created,
        updated and deleted through their order; this read-only detail stays available.
        Accessible by super_admin only.
