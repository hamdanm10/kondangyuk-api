                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: object
                  properties:
                    slug:
                      type: string
                      example: wedding-classic
                    name:
                      type: string
