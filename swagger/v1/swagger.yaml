                    description:
                      type: string
                      nullable: true
                    published_at:
                      type: string
                      format: date-time
                      nullable: true
                  required:
                  - slug
                  - name
        required: true
    delete:
      summary: Delete template
      tags:
      - Super Admin | Templates
      description: Soft deletes a template by ID or slug (sets deleted_at). Record
