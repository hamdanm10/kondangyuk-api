---
openapi: 3.0.1
info:
  title: Kondangyuk API
  version: v1
  description: API documentation for Kondangyuk
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
  schemas:
    JSendSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
    JSendFail:
      type: object
      properties:
        status:
          type: string
          example: fail
        data:
          type: object
tags:
- name: Public | Sessions
  description: Authentication — login and logout. No authentication required.
- name: Admin | Profiles
  description: Authenticated user profile. Accessible by **admin** and **super_admin**
    roles.
- name: Super Admin | Users
  description: Admin user management. Accessible by **super_admin** role only.
- name: Super Admin | Themes
  description: Digital invitation theme management. Accessible by **super_admin**
    role only.
servers:
- url: http://localhost:3000
  description: Development
paths:
  "/api/v1/profile":
    get:
      summary: Get own profile
      tags:
      - Admin | Profiles
      description: Returns the authenticated user profile. Accessible by admin and
        super_admin.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: profile returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                          role:
                            type: string
                            example: admin
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  data:
                    type: object
  "/api/v1/session":
    post:
      summary: Login
      tags:
      - Public | Sessions
      description: Authenticates user and sets httpOnly session cookie. Rate limited
        to 10 requests/minute per IP.
      parameters: []
      responses:
        '201':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
        '422':
          description: invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  data:
                    type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    email:
                      type: string
                      example: admin@kondangyuk.test
                    password:
                      type: string
                      example: Password12345!
                  required:
                  - email
                  - password
        required: true
    delete:
      summary: Logout
      tags:
      - Public | Sessions
      description: Destroys the current session and clears the session cookie.
      security:
      - cookieAuth: []
      responses:
        '204':
          description: logout successful
  "/api/v1/templates/{template_id}/document":
    parameters:
    - name: template_id
      in: path
      required: true
      description: Template ID or slug
      schema:
        type: string
    get:
      summary: Show template document
      tags:
      - Super Admin | Template Documents
      description: Returns the document (frontmatter meta + raw MDX) for a template,
        looked up by template ID or slug. Accessible by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: document returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      document:
                        type: object
                        properties:
                          id:
                            type: integer
                          template_id:
                            type: integer
                          meta:
                            type: object
                          document:
                            type: string
        '404':
          description: template or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
    patch:
      summary: Update template document
      tags:
      - Super Admin | Template Documents
      description: Updates the document (meta + MDX) for a template, looked up by
        template ID or slug. Accessible by super_admin only.
      security:
      - cookieAuth: []
      parameters: []
      responses:
        '200':
          description: document updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      document:
                        type: object
                        properties:
                          id:
                            type: integer
                          template_id:
                            type: integer
                          meta:
                            type: object
                          document:
                            type: string
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '404':
          description: template or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template_document:
                  type: object
                  properties:
                    meta:
                      type: object
                      example:
                        title: Updated
                    document:
                      type: string
                      example: |-
                        ---
                        title: Updated
                        ---
                        # Updated
                  required:
                  - document
        required: true
    delete:
      summary: Delete template document
      tags:
      - Super Admin | Template Documents
      description: Permanently deletes a template document (hard delete). The template_documents
        table has no deleted_at column. Accessible by super_admin only.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: document deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
        '404':
          description: template or document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
  "/api/v1/templates":
    get:
      summary: List all templates
      tags:
      - Super Admin | Templates
      description: Returns all templates with pagination. Accessible by super_admin
        only.
      security:
      - cookieAuth: []
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: 'Items per page (default: 10, max: 100)'
        schema:
          type: integer
      responses:
        '200':
          description: templates returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            slug:
                              type: string
                            name:
                              type: string
                            description:
                              type: string
                              nullable: true
                            published_at:
                              type: string
                              format: date-time
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 1
                          total_count:
                            type: integer
                            example: 3
                          prev_page:
                            type: integer
                            nullable: true
                            example:
                          next_page:
                            type: integer
                            nullable: true
                            example:
                          limit:
                            type: integer
                            example: 10
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
    post:
      summary: Create template
      tags:
      - Super Admin | Templates
      description: Creates a template together with its document (atomic). The MDX
        document is stored as-is and rendered by the client. created_by_user is taken
        from the authenticated user. Accessible by super_admin only.
      security:
      - cookieAuth: []
      parameters: []
      responses:
        '201':
          description: template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      template:
                        type: object
                        properties:
                          id:
                            type: integer
                          slug:
                            type: string
                          name:
                            type: string
                          description:
                            type: string
                            nullable: true
                          published_at:
                            type: string
                            format: date-time
                            nullable: true
                          created_at:
                            type: string
                            format: date-time
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
        '403':
          description: forbidden — admin role cannot access
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSendFail"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: object
                  properties:
                    slug:
                      type: string
                      example: wedding-classic
                    name:
                      type: string
                      example: Wedding Classic
                    description:
                      type: string
                      nullable: true
                      example: A classic theme
                    published_at:
                      type: string
                      format: date-time
                      nullable: true
                    meta:
                      type: object
                      example:
                        title: Wedding Classic
                    document:
                      type: string
                      example: |-
                        ---
                        title: Wedding
                        ---
                        # Hello
                  required:
                  - slug
                  - name
                  - document
        required: true
