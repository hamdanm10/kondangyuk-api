                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            slug:
                              type: string
                            name:
                              type: string
                            description:
                              type: string
